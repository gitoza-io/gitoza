[package]
name = "gitoza-tauri"
# Crate metadata only; runtime app semver is in tauri.conf.json.
version = "0.1.0"
description = "Gitoza desktop shell"
authors = ["Gitoza"]
license.workspace = true
edition = "2021"
rust-version = "1.77"

[lib]
name = "gitoza_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
machine-uid = "0.5"
hostname = "0.4"
gitoza-rust-backend = { path = "../rust-backend" }
tokio = { version = "1", features = ["sync"] }
tauri-plugin-opener = "2.7"
tauri-plugin-process = "2.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.13"
