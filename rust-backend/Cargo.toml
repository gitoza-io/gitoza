[package]
name = "gitoza-rust-backend"
version = "0.1.0"
license.workspace = true
edition = "2021"

[lib]
name = "gitoza_rust_backend"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
indexmap = "2"
sync-git = { path = "../crates/sync-git" }
sync-engine = { path = "../crates/sync-engine" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
typst = "0.14.2"
typst-as-lib = { version = "0.15.4", features = ["typst-kit-fonts", "typst-kit-embed-fonts", "packages", "ureq"] }
typst-pdf = "0.14.2"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
regex = "1"
tempfile = "3"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
quick-xml = "0.37"

